<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<meta name="description" content="在手机上舒适地阅读论文：PDF 原版与重排阅读、划线笔记、双语对照。数据只保存在本机。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="研读">
<title>研读 · 论文阅读</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<script>
  // 尽早应用主题，避免闪烁
  (function(){try{var s=JSON.parse(localStorage.getItem('yandu.settings')||'{}');var t=s.theme||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
</head>
<body>
<div id="phone">
  <div id="stage">
    <section id="v-library" class="tabview active"></section>
    <section id="v-notes" class="tabview"></section>
    <section id="v-me" class="tabview"></section>
    <button class="fab" id="fab" aria-label="导入论文"></button>
    <nav class="tabbar" id="tabbar"></nav>
    <section id="v-reader">
      <div class="r-head">
        <button class="icon-btn" id="r-back" aria-label="返回"></button>
        <div class="r-title"><div class="t" id="r-t"></div><div class="s" id="r-s"></div></div>
        <div class="seg" id="r-mode"><button data-m="reflow">重排</button><button data-m="pdf">原版</button></div>
        <button class="icon-btn" id="r-more" aria-label="更多"></button>
      </div>
      <div class="r-progress"><i id="r-bar"></i></div>
      <div class="r-trans" id="r-trans"><span>翻译</span><div class="seg" id="trans-seg">
        <button data-t="off">原文</button><button data-t="tap">点按翻译</button><button data-t="bi">双语对照</button><button data-t="zh">仅译文</button></div></div>
      <div class="r-body" id="r-body" data-trans="off"></div>
      <div class="r-toolbar" id="r-toolbar"></div>
    </section>
  </div>
  <div id="selbar"></div>
  <div id="popdef"></div>
  <div id="backdrop"></div>
  <div class="sheet" id="sheet"></div>
  <div id="toast"></div>
  <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
</div>
<noscript>需要启用 JavaScript。</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
